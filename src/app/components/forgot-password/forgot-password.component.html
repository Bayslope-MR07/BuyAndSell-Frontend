<header class="site-header">
  <img src="Logo.png" alt="SellBuyPatent Logo" class="site-logo" />
</header>

<div class="container custom-border mt-5 signup-container forgot-form">
  <div class="row justify-content-center">
    <div class="col-md-8 gap-lg-5">
    <h1 class="text-center">Forgot Password</h1>
    <p>Enter E-mail Address and we will send you the code</p>
    <form id="sendOTP">
        <div class="col-md-12 mb-3">
            <label for="first_name text-center">Email Address</label>
            <div class="input-group">
              <input type="email" id="first_name"  name="email" class="form-control" [(ngModel)]="email" placeholder="Enter....." required>
              <span class="input-group-text">
                <i class="bi bi-pen"></i>
              </span>
            </div>
          </div>
    </form>
    <button type="submit" [disabled]="!email" (click)="otpSend()">Submit</button>
   
    <button id="buttonBack" (click)="backLogin()">
      <i class="fa fa-arrow-left " aria-hidden="true"></i>
        <a>
            Back</a></button>
    </div>
  </div>
</div>



    <footer class="">
  <div class="footer-bottom">
    © 2025 SellBuyPatent. All Rights Reserved.
  </div>
</footer>

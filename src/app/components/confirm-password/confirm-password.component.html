<div class="confirm-form">
    <h1 class="text-center">Change Password</h1>
    <p>Enter the required details to update your password</p>
  
    <form id="confirmPassword" (ngSubmit)="onSubmit()">
      <!-- Show old password only if not coming from forgot password flow -->
      <div class="col-md-12 mb-3" *ngIf="!fromForgotPassword">
        <label for="old_password">Old Password</label>
        <input 
          type="password" 
          id="old_password" 
          name="old_password" 
          class="form-control" 
          placeholder="Enter old password" 
          [(ngModel)]="formData.old_password"
          required
        >
      </div>
  
      <!-- New Password -->
      <div class="col-md-12 mb-3">
        <label for="new_password">New Password</label>
        <input 
          type="password" 
          id="new_password" 
          name="new_password" 
          class="form-control" 
          placeholder="Enter new password" 
          [(ngModel)]="formData.new_password"
          required
        >
      </div>
  
      <!-- Confirm Password -->
      <div class="col-md-12 mb-3">
        <label for="confirm_password">Confirm Password</label>
        <input 
          type="password" 
          id="confirm_password" 
          name="confirm_password" 
          class="form-control" 
          placeholder="Confirm new password" 
          [(ngModel)]="formData.confirm_password"
          required
        >
      </div>
  
      <!-- Buttons -->
      <button type="submit">Submit</button>
      <button id="buttonBack" (click)="goBack()">
        <i class="fa fa-arrow-left" aria-hidden="true"></i>
        Back
      </button>
    </form>
  </div>

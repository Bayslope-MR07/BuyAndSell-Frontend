<!-- Header -->
<app-profile-header></app-profile-header>

<!-- Navigation Tabs -->

<div
  class="d-flex justify-content-center gap-5 align-items-center a-class mb-4"
>
  <a  class="nav-link text-primary" (click)="buyer()">Details</a>
  <a class="nav-link text-primary" style="cursor: pointer" aria-disabled="true"
    >Analytics</a
  >
</div>

<!-- Main Content -->
<div *ngIf="!loader; else loading" class="container my-4">
  <div class="row row-cols-1 row-cols-md-2 g-4">
    <!-- Chart 1: Total Number of Listed Patents -->
    <div class="col">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">Total Users</h5>
          <!-- <canvas id="listedPatentsChart" class="chart-canvas"></canvas> -->
          <app-pie-chart [data]="Statusdata"></app-pie-chart>
        </div>
      </div>
    </div>

    <!-- Chart 2: Total Number of Patents by Category -->
    <div class="col">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">User Feedbacks on Patent</h5>
          <!-- <canvas id="patentsByCategoryChart" class="chart-canvas"></canvas> -->
          <app-pie-chart [data]="CategoryData"></app-pie-chart>
        </div>
      </div>
    </div>

    <!-- Chart 3: Total Number of Patents by Life -->
    <div class="col">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Number of Patents by catgory</h5>
          <!-- <canvas id="patentsByLifeChart" class="chart-canvas"></canvas> -->
          <canvas
          baseChart
          [data]="barChartDataTechCategory"
          [type]="barChartTypeTechCategory"
          [options]="barChartOptions"
          style="max-height: 400px; width: 100%;"
        >
        </canvas>
        </div>
      </div>
    </div>

    <!-- Chart 4: Total Number of Patents by Bay Rating -->
    <div class="col">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">Total Number of Patents by Bay Rating</h5>
          <canvas id="patentsByBayRatingChart" class="chart-canvas"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #loading>
  <div
    style="
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      padding: 20px;
      height: 150vh;
    "
  >
    <div><mat-spinner></mat-spinner></div>
    <div><p>Loading Analytics...</p></div>
  </div>
</ng-template>
<!-- Footer -->
<app-footer></app-footer>

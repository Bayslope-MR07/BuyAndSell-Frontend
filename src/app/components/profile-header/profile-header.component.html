<div class="navbar fixed-top navbar-expand-lg">
  <div class="logo" (click)="homePage()">
    <img src="Logo.png" alt="Logo" class="logo-img" />
  </div>
  <nav>
    <ul>
      <li *ngIf="check1">
        <a [class.active]="isRouteActive('/buyer')" (click)="buyer()">Buyer</a>
      </li>
      <li *ngIf="check2">
        <a [class.active]="isRouteActive('/user-seller-data')" (click)="seller()">Seller</a>
      </li>
      <li class="login-container">
        <button mat-icon-button [matMenuTriggerFor]="menu" class="login-button">
          <mat-icon class="login-icon">person</mat-icon>
        </button>
        <mat-menu #menu="matMenu" class="login-menu bg-primary">
          <button mat-menu-item class="menu-item user-login text-white" (click)="updateUserProfile()">Update Profile</button>
          <button mat-menu-item class="menu-item user-login text-white" (click)="goForgot()">Password Change</button>
          <button mat-menu-item class="menu-item user-login text-white" (click)="logout()">Log Out</button>
        </mat-menu>
      </li>
    </ul>
  </nav>
</div>

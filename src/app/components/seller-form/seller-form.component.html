<div class="mb-xxl-2">
  <app-profile-header></app-profile-header>
</div>


<div class="container  p-2 bg-light rounded shadow" style="margin-top: 5%;">
  <p class="subtitle text-start mb-4 mt-lg-1">
    Please enter the details below to sell.
  </p>

  <form #sellerForm="ngForm" (ngSubmit)="onSubmit()">
    <!-- ========== Section: Expectation Details ========== -->
     <h4 class="mt-2 mb-3  ">Expectation Details</h4>
    <div class="row">
      <div class="col-md-4 mb-3 swipe-left">
        <label for="portfolio_type" class="form-label">Monetization Options</label>
        <select
          class="form-select"
          [(ngModel)]="formData.portfolio_type"
          name="portfolio_type"
          required
        >
          <option value="sale_only">Sale Only</option>
          <option value="license_only">License Only</option>
          <option value="sale_and_license">Any</option>
        </select>
      </div>

            <div class="col-md-3 mb-3 swipe-left">
        <label for="price_expectation" class="form-label "
          >Price Expectation</label
        >
        <select
          class="form-select"
          [(ngModel)]="formData.price_expectation"
          name="price_expectation"
          required
        >
<!-- <option value="10000">Low 5 Figures range - $10,000</option>
<option value="50000">Mid 5 Figures range - $50,000</option>
<option value="100000">Low 6 Figures range - $100,000</option>
<option value="250000">Mid 6 Figures range - $250,000</option>
<option value="1000000">Low 7 Figures range - $1,000,000</option> -->

<!-- <select> -->
  <option value="10000">Low 5 Figures range </option>
  <option value="25000">Low-to-Mid 5 Figures range </option>
  <option value="50000">Mid-to-High 5 Figures range </option>

  <option value="100000">Low 6 Figures range </option>
  <option value="250000">Low-to-Mid 6 Figures range</option>
  <option value="500000">Mid-to-High 6 Figures range </option>
  <option value="999999">High 6 Figures range </option>

  <option value="1000000">Low 7 Figures range </option>
  <option value="2500000">Low-to-Mid 7 Figures range </option>
  <option value="5000000">Mid-to-High 7 Figures range </option>
  <option value="9999999">High 7 Figures range </option>
          <option value="">Other</option>
        </select>
      </div>

      <!-- <div class="col-md-4 mb-3">
        <label for="encumbrances" class="form-label">Encumbrances</label>
        <select class="form-select" [(ngModel)]="formData.encumbrances" name="encumbrances">
          <option value="none">None</option>
          <option value="pledged">Pledged</option>
          <option value="licensed">Licensed</option>
          <option value="liens">Liens</option>
          <option value="litigation">Litigation (ongoing / past)</option>
        </select>
      </div> -->


            <div class="col-md-4 mb-3 swipe-left">
        <label for="motivation_to_sell" class="form-label">Motivation to sell</label>
        <select class="form-select" [(ngModel)]="formData.motivation_to_sell" name="motivation_to_sell">
          <option value="non_core">Non-Core</option>
          <option value="need_funding">Need Funding</option>
          <option value="bankruptcy">Bankruptcy</option>
          <option value="other">Other</option>
        </select>
      </div>


      <!-- ========== Section: Owner Details ========== -->

<h4 class="mt-4 mb-3">Owner Details</h4>
<div class="row">
      <div class="col-md-3 mb-3 swipe-left">
        <label for="patent_owner_status" class="form-label"
          >Who are you</label
        >
        <select
          class="form-select"
          [(ngModel)]="formData.patent_owner_status"
          name="patent_owner_status"
          required
        >
          <option value="owner">Patent Owner</option>
          <option value="broker">Patent Broker</option>
          <option value="broker">Others</option>
        </select>
      </div>



      <div class="col-md-3 mb-3 swipe-left">
        <label for="first_name" class="form-label">First Name</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="formData.first_name"
          name="first_name"
          required
        />
      </div>
      

      <div class="col-md-3 mb-3 swipe-left">
        <label for="last_name" class="form-label">Last Name</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="formData.last_name"
          name="last_name"
          required
        />
      </div>

      <div class="col-md-3 mb-3 swipe-left">
        <label for="email" class="form-label">Email</label>
        <input
          type="email"
          class="form-control"
          [(ngModel)]="formData.email"
          name="email"
          required
        />
      </div>

      <div class="col-md-3 mb-3 swipe-left">
        <label for="phone" class="form-label">Phone</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="formData.phone"
          name="phone"
          required
        />
      </div>

      <div class="col-md-4 mb-3 swipe-left">
        <label for="patent_owner_website" class="form-label"
          >Patent Owner Website (Optional)</label
        >
        <input
          type="url"
          class="form-control"
          [(ngModel)]="formData.patent_owner_website"
          name="patent_owner_website"
        />
      </div>
      </div>


      <!-- ========== Section: Patent Details ========== -->
  <h4 class="mt-4 mb-3">Patent Details</h4>



      <div class="col-md-3 mb-3 swipe-left">
        <label for="primary_technology" class="form-label"
          >Primary Technology</label
        >
        <input
          type="text"
          class="form-control"
          [(ngModel)]="formData.primary_technology"
          name="primary_technology"
          required
        />
      </div>

      <!-- <div class="col-md-4 mb-3">
        <label for="deadline" class="form-label">Deadline (Optional)</label>
        <input
          type="date"
          class="form-control"
          [(ngModel)]="formData.deadline"
          name="deadline"
        />
      </div>

      <div class="col-md-4 mb-3">
        <label for="expiry" class="form-label">Expiry</label>
        <input
          type="date"
          class="form-control"
          [(ngModel)]="formData.expiry"
          name="expiry"
        />
      </div> -->







    <!-- </div> -->





      <div
        *ngFor="let patent of formData.patents; let i = index"
        class="col-12 mt-4 border p-3 rounded bg-white"
      >
        <h5 class="mb-3">Patent {{ i + 1 }}</h5>

        <div class="row">

                    <div class="col-md-4 mb-3 swipe-left">
            <label class="form-label">Patent No {{ i + 1 }}:</label>
            <input
              type="text"
              class="form-control"
              [(ngModel)]="patent.patent_number"
              [name]="'patent_number_' + i"
              required
            />
          </div>
                    <div class="col-md-3 mb-3 swipe-left">
            <label class="form-label">Status:</label>
            <input
              type="text"
              class="form-control"
              [(ngModel)]="patent.status"
              [name]="'status_' + i"
              required
            />
          </div>
          <div class="col-md-4 mb-3 swipe-left">
            <label class="form-label">Country:</label>
            <input
              type="text"
              class="form-control"
              [(ngModel)]="patent.country"
              [name]="'country_' + i"
              required
            />
          </div>


          <!-- <div class="col-md-4 mb-3">
            <label class="form-label">Publication #:</label>
            <input type="text" class="form-control" [(ngModel)]="patent.publication_number" [name]="'publication_number_' + i" />
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label">Application #:</label>
            <input type="text" class="form-control" [(ngModel)]="patent.application_number" [name]="'application_number_' + i" />
          </div> -->
          <div class="col-md-4 mb-3 swipe-left">
            <label class="form-label">Google Patent Link:</label>
            <input
              type="text"
              class="form-control"
              [(ngModel)]="patent.google_patent_link"
              [name]="'google_patent_link_' + i"
            />
          </div>
        </div>
        <button
          type="button"
          class="btn btn-danger btn-sm mt-2"
          (click)="removePatent(i)"
        >
          Remove
        </button>
      </div>

      <div class="col-12 mb-4">
        <button
          type="button"
          class="btn btn-success btn-sm mt-3"
          (click)="addPatent()"
        >
          Add Patent
        </button>
      </div>

      <div class="w-100 mb-4 swipe-left">
        <label for="file" class="form-label">Supporting material (if available)</label>
        <input
          type="file"
          class="form-control form-control-md"
          (change)="onFileChange($event)"
        />
      </div>

      <div class="d-flex flex-row-reverse">
        <button
          type="submit"
          class="btn btn-success btn-md"
          [disabled]="sellerForm.invalid"
        >
          Submit
        </button>
      </div>
    </div>
  </form>
</div>
<app-footer></app-footer>
